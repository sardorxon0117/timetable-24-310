<script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzSpGkWZwVgu20b9FH9QtEh4bD18XTENDW-l7-mkIGgA3PNMZ41nyXqh-nAnd_9N8NR/exec";

    const periods = [
      { name: "1-para", time: "08:00 – 09:20" },
      { name: "2-para", time: "09:30 – 10:50" },
      { name: "3-para", time: "11:00 – 12:20" },
      { name: "4-para", time: "13:30 – 14:50" },
      { name: "5-para", time: "15:00 – 16:20" },
      { name: "6-para", time: "16:30 – 17:50" },
      { name: "7-para", time: "18:00 – 19:20" }
    ];

    let scheduleData = {
      // Zaxira ma'lumotlar
      "5-3": { subject: "Internet of Things", type: "Amaliyot", teacher: "Rezayei Sardareh", room: "238-xona", color: "green" },
      "6-3": { subject: "Internet of Things", type: "Amaliyot", teacher: "Rezayei Sardareh", room: "234-xona", color: "green" },
      "1-5": { subject: "Advanced Programming", type: "Amaliyot", teacher: "Islomboyev Botir", room: "227-xona", color: "orange" },
      "2-5": { subject: "Advanced Programming", type: "Amaliyot", teacher: "Islomboyev Botir", room: "227-xona", color: "orange" },
      "3-5": { subject: "Advanced Programming", type: "Amaliyot", teacher: "Islomboyev Botir", room: "227-xona", color: "orange" },
      "4-5": { subject: "Advanced Programming", type: "Ma’ruza", teacher: "Islomboyev Botir", room: "133-xona", color: "orange" },
      "5-5": { subject: "Risk Analysis and Systems Testing", type: "", teacher: "", room: "236-xona", color: "orange" },
      "1-6": { subject: "Advanced Programming", type: "Amaliyot", teacher: "Islomboyev Botir", room: "227-xona", color: "purple" },
      "2-6": { subject: "Advanced Programming", type: "Ma’ruza", teacher: "Islomboyev Botir", room: "133-xona", color: "purple" },
      "3-6": { subject: "Falsafa", type: "", teacher: "Baxranov Lazizjon", room: "323-xona", color: "purple" },
      "4-6": { subject: "Falsafa", type: "", teacher: "Baxranov Lazizjon", room: "238-xona", color: "purple" },
      "5-6": { subject: "Digital Sustainability", type: "", teacher: "G‘ulomov Abdulaziz", room: "236-xona", color: "purple" }
    };

    const roomLocations = {
      "133-xona": { floor: 1, top: 58, left: 81.5, name: "133-xona (Auditoriya)" },
      "227-xona": { floor: 2, top: 22, left: 56.5, name: "227-xona (Amaliyot)" },
      "234-xona": { floor: 2, top: 43, left: 82.5, name: "234-xona (IoT Amaliyot)" },
      "236-xona": { floor: 2, top: 43, left: 88.5, name: "236-xona" },
      "238-xona": { floor: 2, top: 43, left: 94.0, name: "238-xona" },
      "323-xona": { floor: 3, top: 82, left: 59.2, name: "323-xona (Falsafa)" }
    };

    function renderTable() {
      const tbody = document.getElementById("schedule");
      tbody.innerHTML = "";

      periods.forEach((period, p) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="time-cell">
            <div class="period">${period.name}</div>
            <div class="time">${period.time}</div>
          </td>
        `;

        for (let day = 0; day < 7; day++) {
          const cell = document.createElement("td");
          const key = `${p}-${day}`;
          const lesson = scheduleData[key];

          if (lesson) {
            cell.innerHTML = `
              <div class="lesson ${lesson.color}" onclick='openMap("${lesson.room}", "${lesson.subject}")'>
                <div class="lesson-time">${period.time}</div>
                <div class="lesson-title">
                  ${lesson.subject}
                  ${lesson.type ? `<span class="lesson-type">(${lesson.type})</span>` : ""}
                </div>
                ${lesson.teacher ? `<div class="teacher">👤 ${lesson.teacher}</div>` : ""}
                <div class="room">📍 ${lesson.room}</div>
              </div>
            `;
          } else {
            cell.innerHTML = `<div class="empty"><span>—</span></div>`;
          }
          row.appendChild(cell);
        }
        tbody.appendChild(row);
      });
    }

    // Google Sheets ma'lumotlarini parse qilish
    async function fetchSheetData() {
      try {
        const response = await fetch(SHEET_API_URL);
        const rows = await response.json();

        if (!rows || rows.length === 0) return;

        // "24-310 (EN)" guruhiga tegishli qatorni topish
        let myGroupRow = null;
        for (let i = 0; i < rows.length; i++) {
          if (rows[i][0] && rows[i][0].includes("24-310")) {
            myGroupRow = rows[i];
            break;
          }
        }

        if (!myGroupRow) return;

        // Ma'lumotlarni mos ravishda ajratib olish
        const dayColors = ["green", "green", "green", "green", "green", "orange", "purple"];
        
        // Google Sheet'dagi har bir ustundan darslarni o'qish
        // (1-ustun Dushanba 1-para, 2-ustun Dushanba 2-para va h.k.)
        let colIndex = 1;
        for (let day = 0; day < 7; day++) {
          for (let period = 0; period < 7; period++) {
            const cellText = myGroupRow[colIndex];
            if (cellText && cellText.trim() !== "") {
              const lines = cellText.split("\n").map(l => l.trim()).filter(l => l);
              
              const subject = lines[0] || "Dars";
              const teacher = lines[1] || "";
              const roomRaw = lines[2] || "";
              
              // Xona raqamini ajratish (masalan: "227 Room" -> "227-xona")
              let room = roomRaw;
              const match = roomRaw.match(/\d+/);
              if (match) {
                room = `${match[0]}-xona`;
              }

              scheduleData[`${period}-${day}`] = {
                subject: subject,
                type: subject.includes("Practice") ? "Amaliyot" : (subject.includes("Lecture") ? "Ma'ruza" : ""),
                teacher: teacher,
                room: room,
                color: dayColors[day]
              };
            }
            colIndex++;
          }
        }

        // Qayta jadvalni chizish
        renderTable();
      } catch (e) {
        console.log("Google Sheets yuklanishida xatolik:", e);
      }
    }

    renderTable();
    fetchSheetData();

    // MAP MODAL LOGIC
    let currentFloor = 2;
    let selectedRoomKey = null;

    function openMap(roomName, subjectName) {
      const roomInfo = roomLocations[roomName] || { floor: 2, top: 50, left: 50, name: roomName };
      selectedRoomKey = roomName;
      currentFloor = roomInfo.floor;

      document.getElementById("modalTitle").textContent = `📍 ${subjectName} — ${roomName}`;
      document.getElementById("mapModal").classList.add("active");
      
      switchFloor(currentFloor, roomInfo);
    }

    function closeModal() {
      document.getElementById("mapModal").classList.remove("active");
    }

    function switchFloor(floorNum, targetRoom = null) {
      currentFloor = floorNum;
      
      for(let i=1; i<=3; i++) {
        document.getElementById(`tab${i}`).classList.toggle("active", i === floorNum);
      }

      const img = document.getElementById("floorImage");
      const pin = document.getElementById("mapPin");
      const banner = document.getElementById("mapInfoBanner");

      if (floorNum === 1) {
        img.src = "1-qavat.jpg";
      } else if (floorNum === 2) {
        img.src = "2-qavat1.jpg";
      } else {
        img.src = "3-qavat.jpg";
      }

      const activeRoom = targetRoom || roomLocations[selectedRoomKey];
      if (activeRoom && activeRoom.floor === floorNum) {
        pin.style.top = `${activeRoom.top}%`;
        pin.style.left = `${activeRoom.left}%`;
        pin.style.display = "block";
        banner.innerHTML = `✅ <b>${activeRoom.name}</b> ushbu qavatda (qizil miltillovchi nuqta).`;
        banner.style.display = "flex";
      } else {
        pin.style.display = "none";
        banner.innerHTML = `ℹ️ Bu xona ${floorNum}-qavatda emas.`;
        banner.style.display = "flex";
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById("themeToggle");
      if (html.getAttribute("data-theme") === "light") {
        html.setAttribute("data-theme", "dark");
        btn.textContent = "☀️";
      } else {
        html.setAttribute("data-theme", "light");
        btn.textContent = "🌙";
      }
    }
  </script>
